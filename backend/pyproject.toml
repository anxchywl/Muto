[project]
name = "muto-backend"
version = "0.1.0"
description = "Backend service for the Muto student marketplace"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.16,<2.0",
  "asyncpg>=0.30,<1.0",
  "boto3>=1.40,<2.0",
  "fastapi>=0.116,<1.0",
  "greenlet>=3.2,<4.0",
  "Pillow>=11.3,<13.0",
  "pydantic-settings>=2.10,<3.0",
  "SQLAlchemy>=2.0.41,<3.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2.0",
  "httpx2>=2.10,<3.0",
  "mypy>=1.17,<2.0",
  "pytest>=9.0.3,<10.0",
  "pytest-asyncio>=1.1,<2.0",
  "pytest-cov>=6.2,<7.0",
  "ruff>=0.12,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "strict"
markers = [
  "integration: tests that require postgresql",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true
