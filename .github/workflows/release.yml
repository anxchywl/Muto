name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.38.5"
  JAVA_VERSION: "17"

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Cache pub and gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-${{ runner.os }}-${{ hashFiles('muto_app/pubspec.lock', 'muto_app/android/**/*.kts', 'muto_app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: android-${{ runner.os }}-

      - name: Require a revision from the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"

      - name: Verify release source
        run: ./scripts/verify.sh

      - name: Generate feature localizations
        working-directory: muto_feature
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Build release artifact
        working-directory: muto_app
        run: flutter build apk --release --dart-define=ENABLE_DEV_ACCESS=false

      - name: Rename artifact to the tag
        run: cp muto_app/build/app/outputs/flutter-apk/app-release.apk muto-${{ github.ref_name }}.apk

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: muto-${{ github.ref_name }}.apk
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
