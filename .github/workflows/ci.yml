name: CI

# Continuous integration only. There is nothing to deploy from this repository
# and no job here publishes, signs or uploads anything.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# read-only, and no job asks for more; a fork's pull request gets the same
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: "3.38.5"
  JAVA_VERSION: "17"

jobs:
  quality:
    name: Format, analyze and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml', 'muto_app/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Resolve dependencies
        run: |
          for package in app_ui muto_ui muto_feature muto_app; do
            (cd "$package" && flutter pub get)
          done

      - name: Check formatting
        run: |
          for package in muto_ui muto_feature muto_app; do
            (cd "$package" && dart format --output=none --set-exit-if-changed lib test)
          done

      - name: Analyze
        run: |
          for package in muto_ui muto_feature muto_app; do
            (cd "$package" && flutter analyze --no-pub --fatal-infos)
          done

      - name: Test
        run: |
          (cd muto_ui && flutter test --no-pub)
          (cd muto_app && flutter test --no-pub)
          (cd muto_feature && flutter test --no-pub --coverage)

      - name: Enforce coverage floor
        run: ./scripts/coverage_floor.sh muto_feature/coverage/lcov.info 70

  debug-build:
    name: Debug build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub and gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-${{ runner.os }}-${{ hashFiles('muto_app/pubspec.lock', 'muto_app/android/**/*.kts', 'muto_app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: android-${{ runner.os }}-

      - name: Build debug artifact
        working-directory: muto_app
        run: flutter build apk --debug

  release-guard:
    name: Release build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub and gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-${{ runner.os }}-${{ hashFiles('muto_app/pubspec.lock', 'muto_app/android/**/*.kts', 'muto_app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: android-${{ runner.os }}-

      # proves a shipped build compiles with development access switched off,
      # and that the guard cannot be turned back on from a define
      - name: Build release artifact
        working-directory: muto_app
        run: flutter build apk --release --dart-define=ENABLE_DEV_ACCESS=false

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # full history, so a secret committed earlier is still found
          fetch-depth: 0

      - name: Install gitleaks
        env:
          VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Scan repository history
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose

  dependencies:
    name: Dependency scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install osv-scanner
        env:
          VERSION: "2.5.0"
        run: |
          curl -sSfL -o /usr/local/bin/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${VERSION}/osv-scanner_linux_amd64"
          chmod +x /usr/local/bin/osv-scanner

      # the application lockfile is the only one committed; the library
      # packages resolve through it
      - name: Scan committed lockfiles
        run: osv-scanner scan source --lockfile=muto_app/pubspec.lock
