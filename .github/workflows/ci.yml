name: CI

# pull requests only validate. a default-branch push deploys only after every
# required check succeeds and deployment secrets are configured

on:
  push:
  pull_request:

# read-only, and no job asks for more; a fork's pull request gets the same
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: "3.38.5"
  JAVA_VERSION: "17"
  PYTHON_VERSION: "3.12"

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      flutter: ${{ steps.filter.outputs.flutter }}
      deploy: ${{ steps.filter.outputs.deploy }}
      # a matrix job's `if` can't see the `matrix` context, so which Android
      # variant to build for this event is decided here instead
      android_matrix: ${{ steps.android_matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            flutter:
              - 'app_ui/**'
              - 'muto_app/**'
              - 'muto_feature/**'
              - 'muto_ui/**'
            deploy:
              - 'deploy/**'
              - 'backend/Dockerfile'
              - 'docker-compose.production.yml'

      - name: Select android build variant
        id: android_matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo 'matrix=[{"id":"release","name":"Release build","args":"--release --dart-define=ENABLE_DEV_ACCESS=false"}]' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=[{"id":"debug","name":"Debug build","args":"--debug"}]' >> "$GITHUB_OUTPUT"
          fi

  backend-quality:
    name: Backend format, analyze and test
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://muto:muto@localhost:5432/muto
      CURSOR_SECRET: test-cursor-secret-that-is-at-least-32-bytes

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev

      - name: Check backend formatting
        working-directory: backend
        run: uv run --frozen ruff format --check app migrations tests

      - name: Lint backend
        working-directory: backend
        run: uv run --frozen ruff check app migrations tests

      - name: Type-check backend
        working-directory: backend
        run: uv run --frozen mypy app

      - name: Scan backend source
        working-directory: backend
        run: uv run --frozen bandit -q -r app

      - name: Test backend
        working-directory: backend
        run: uv run --frozen pytest tests/unit -q

  backend-integration:
    name: Backend migration integration
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: muto
          POSTGRES_USER: muto
          POSTGRES_PASSWORD: muto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U muto -d muto"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://muto:muto@localhost:5432/muto
      TEST_DATABASE_URL: postgresql+asyncpg://muto:muto@localhost:5432/muto
      CURSOR_SECRET: test-cursor-secret-that-is-at-least-32-bytes
      TEST_S3_ENDPOINT: http://localhost:9000
      TEST_S3_ACCESS_KEY_ID: muto-test-access
      TEST_S3_SECRET_ACCESS_KEY: muto-test-secret

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev

      - name: Start S3-compatible storage
        run: |
          docker run -d --name muto-minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$TEST_S3_ACCESS_KEY_ID" \
            -e MINIO_ROOT_PASSWORD="$TEST_S3_SECRET_ACCESS_KEY" \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready; then
              exit 0
            fi
            echo "waiting for storage readiness: $attempt/30"
            sleep 1
          done
          docker logs muto-minio
          exit 1

      - name: Apply migrations
        working-directory: backend
        run: uv run --frozen alembic -c alembic.ini upgrade head

      - name: Check migration drift
        working-directory: backend
        run: uv run --frozen alembic -c alembic.ini check

      - name: Test migrated database
        working-directory: backend
        run: uv run --frozen pytest tests --cov=app --cov-report=term-missing --cov-fail-under=80 -q

  quality:
    name: Format, analyze and test
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml', 'muto_app/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Resolve dependencies
        run: |
          for package in app_ui muto_ui muto_feature muto_app; do
            (cd "$package" && flutter pub get)
          done

      - name: Check formatting
        run: |
          for package in muto_ui muto_feature muto_app; do
            (
              cd "$package"
              paths=(lib test)
              [ -d integration_test ] && paths+=(integration_test)
              dart format --output=none --set-exit-if-changed "${paths[@]}"
            )
          done

      - name: Analyze
        run: |
          for package in muto_ui muto_feature muto_app; do
            (cd "$package" && flutter analyze --no-pub --fatal-infos)
          done

      - name: Test
        run: |
          (cd muto_ui && flutter test --no-pub)
          (cd muto_app && flutter test --no-pub)
          (cd muto_feature && flutter test --no-pub --coverage)

      - name: Enforce coverage floor
        run: ./scripts/coverage_floor.sh muto_feature/coverage/lcov.info 70

  android-build:
    name: ${{ matrix.name }}
    needs: changes
    runs-on: ubuntu-latest
    # release is the stricter build and proves debug would compile too, so a push
    # to main (which can deploy) only needs release; a pull request only needs the
    # faster debug build for feedback. the changes job already picked exactly one
    # variant for this event, so this only needs to gate on the area changing.
    if: needs.changes.outputs.flutter == 'true'
    strategy:
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.android_matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub and gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-${{ runner.os }}-${{ hashFiles('muto_app/pubspec.lock', 'muto_app/android/**/*.kts', 'muto_app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: android-${{ runner.os }}-

      - name: Generate feature localizations
        working-directory: muto_feature
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Build ${{ matrix.id }} artifact
        working-directory: muto_app
        run: flutter build apk ${{ matrix.args }}

  security:
    name: Secret and dependency scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # full history, so a secret committed earlier is still found
          fetch-depth: 0

      - name: Install gitleaks
        env:
          VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Scan repository history
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose

      - name: Install osv-scanner
        env:
          VERSION: "2.5.0"
        run: |
          curl -sSfL -o /usr/local/bin/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${VERSION}/osv-scanner_linux_amd64"
          chmod +x /usr/local/bin/osv-scanner

      # the application lockfile is the only one committed; the library
      # packages resolve through it
      - name: Scan committed lockfiles
        run: |
          osv-scanner scan source --lockfile=muto_app/pubspec.lock
          osv-scanner scan source --lockfile=backend/uv.lock

  deployment-validation:
    name: Deployment configuration
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check deployment scripts
        run: docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:v0.11.0 deploy/*.sh

      - name: Validate production Compose
        run: |
          cp deploy/production.env.example /tmp/muto-production.env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=test-password/' /tmp/muto-production.env
          sed -i 's/^CURSOR_SECRET=$/CURSOR_SECRET=test-cursor-secret-that-is-at-least-32-bytes/' /tmp/muto-production.env
          sed -i 's/^S3_ACCESS_KEY_ID=$/S3_ACCESS_KEY_ID=test-access/' /tmp/muto-production.env
          sed -i 's/^S3_SECRET_ACCESS_KEY=$/S3_SECRET_ACCESS_KEY=test-secret/' /tmp/muto-production.env
          docker compose --env-file /tmp/muto-production.env -f docker-compose.production.yml config --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build backup image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/backup.Dockerfile
          push: false
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup

  deploy:
    name: Deploy staging environment
    # every dependency may legitimately be skipped when its area didn't change;
    # only an actual failure should block the deploy
    if: |
      always() &&
      github.event_name == 'push' && github.ref_name == github.event.repository.default_branch &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    needs:
      - backend-quality
      - backend-integration
      - quality
      - android-build
      - security
      - deployment-validation
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Check deployment configuration
        id: configured
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -n "$SSH_HOST" ] && [ -n "$SSH_USER" ] && [ -n "$SSH_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::deployment secrets are not configured"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy tested revision
        if: steps.configured.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: DEPLOY_SHA
          script_stop: true
          script: |
            set -eu
            cd /home/deploy/muto/repo
            test -z "$(git status --porcelain)"
            git fetch --prune origin
            git checkout --detach "$DEPLOY_SHA"
            DEPLOY_REF="$DEPLOY_SHA" deploy/deploy.sh
