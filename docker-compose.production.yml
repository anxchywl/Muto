services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  backend:
    image: ${BACKEND_IMAGE:-muto-backend:local}
    restart: unless-stopped
    environment: &backend_environment
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      CURSOR_SECRET: ${CURSOR_SECRET:?CURSOR_SECRET is required}
      AUTH_ADAPTER: ${AUTH_ADAPTER:?AUTH_ADAPTER is required}
      DEVELOPMENT_AUTH_TOKEN: ${DEVELOPMENT_AUTH_TOKEN:-}
      DEVELOPMENT_ADMIN_AUTH_TOKEN: ${DEVELOPMENT_ADMIN_AUTH_TOKEN:-}
      DEVELOPMENT_AUTH_SUBJECT: ${DEVELOPMENT_AUTH_SUBJECT:-student-a}
      DEVELOPMENT_AUTH_DISPLAY_NAME: ${DEVELOPMENT_AUTH_DISPLAY_NAME:-Development Student}
      DEVELOPMENT_AUTH_VERIFIED: ${DEVELOPMENT_AUTH_VERIFIED:-true}
      DEVELOPMENT_ADMIN_AUTH_SUBJECT: ${DEVELOPMENT_ADMIN_AUTH_SUBJECT:-operator-a}
      DEVELOPMENT_ADMIN_AUTH_DISPLAY_NAME: ${DEVELOPMENT_ADMIN_AUTH_DISPLAY_NAME:-Development Operator}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      REQUEST_BODY_MAX_BYTES: ${REQUEST_BODY_MAX_BYTES:-150000}
      DEFAULT_PAGE_SIZE: ${DEFAULT_PAGE_SIZE:-8}
      MAXIMUM_PAGE_SIZE: ${MAXIMUM_PAGE_SIZE:-50}
      IDEMPOTENCY_TTL_HOURS: ${IDEMPOTENCY_TTL_HOURS:-24}
      REPORT_BURST_LIMIT: ${REPORT_BURST_LIMIT:-5}
      REPORT_WINDOW_SECONDS: ${REPORT_WINDOW_SECONDS:-600}
      REPORT_RETENTION_DAYS: ${REPORT_RETENTION_DAYS:-365}
      STORAGE_ADAPTER: ${STORAGE_ADAPTER:?STORAGE_ADAPTER is required}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?S3_ENDPOINT_URL is required}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      IMAGE_UPLOAD_TTL_MINUTES: ${IMAGE_UPLOAD_TTL_MINUTES:-60}
      IMAGE_UPLOAD_BURST_LIMIT: ${IMAGE_UPLOAD_BURST_LIMIT:-30}
      IMAGE_UPLOAD_WINDOW_SECONDS: ${IMAGE_UPLOAD_WINDOW_SECONDS:-3600}
      EXPIRED_UPLOAD_RETENTION_DAYS: ${EXPIRED_UPLOAD_RETENTION_DAYS:-30}
      STORAGE_ORPHAN_GRACE_HOURS: ${STORAGE_ORPHAN_GRACE_HOURS:-24}
    command:
      - .venv/bin/uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-access-log
      - --proxy-headers
      - --forwarded-allow-ips
      - 172.16.0.0/12
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - .venv/bin/python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  maintenance:
    image: ${BACKEND_IMAGE:-muto-backend:local}
    restart: unless-stopped
    environment: *backend_environment
    command:
      - /bin/sh
      - -c
      - while true; do .venv/bin/python -m app.commands.cleanup_images && .venv/bin/python -m app.commands.reconcile_storage && .venv/bin/python -m app.commands.cleanup_records; sleep 3600; done
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  backup:
    build:
      context: .
      dockerfile: deploy/backup.Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-26}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
    volumes:
      - database_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.10-alpine
    # only started on a dedicated host; a shared host fronts muto through its
    # own existing reverse proxy instead (see docker-compose.shared-host.yml)
    profiles: [dedicated]
    restart: unless-stopped
    environment:
      MUTO_API_DOMAIN: ${MUTO_API_DOMAIN:?MUTO_API_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

  monitor:
    image: curlimages/curl:8.17.0
    restart: unless-stopped
    environment:
      MUTO_API_DOMAIN: ${MUTO_API_DOMAIN:?MUTO_API_DOMAIN is required}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    volumes:
      - ./deploy/monitor.sh:/monitor.sh:ro
    command: ["sh", "/monitor.sh"]
    # checks the public domain over HTTPS either way, so a dedicated host
    # only needs its own caddy started first; a shared host overrides this
    # to depend on the backend instead, since no local caddy runs there
    depends_on:
      caddy:
        condition: service_started
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  database_backups:
  caddy_data:
  caddy_config:
