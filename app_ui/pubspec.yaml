name: app_ui
description: >-
  Shared Flutter UI kit: design tokens, generic widgets, light and dark themes.
  Vendored from the Student Events project and not developed here; see
  ../docs/ARCHITECTURE.md before changing anything in it.

version: 1.0.0

environment:
  sdk: ^3.10.0-290.4.beta
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.0
  google_fonts: ^6.3.2
  lucide_flutter: ^1.16.0
  simple_icons: ^16.23.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
