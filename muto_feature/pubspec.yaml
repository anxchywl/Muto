name: muto_feature
description: Embeddable NU student marketplace feature.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  app_ui:
    path: ../app_ui
  muto_ui:
    path: ../muto_ui
  intl: any
  shared_preferences: ^2.3.0
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/sample/
    - assets/sample/images/
